<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="form-no-js.css" />
    <title>Form Page</title>
  </head>
  <body>
    <form action="https://httpbin.org/post" method="POST">
      <p>* indicates required fields</p>

      <form-group>
        <label for="name">Name *</label>
        <input
          type="text"
          name="name"
          id="name"
          autocomplete="name"
          minlength="1"
          maxlength="100"
          aria-describedby="name-rules error-area"
          required
        />
        <small id="name-rules">Enter 1-100 characters.</small>
      </form-group>

      <form-group>
        <label for="email">Email *</label>
        <input
          type="email"
          name="email"
          id="email"
          autocomplete="email"
          aria-describedby="email-rules error-area"
          required
        />
        <small id="email-rules">Enter a valid email address.</small>
      </form-group>

      <form-group>
        <label for="comments">Comments *</label>
        <textarea
          name="comments"
          id="comments"
          minlength="10"
          maxlength="1000"
          aria-describedby="comments-rules info-area error-area"
          required
        ></textarea>
        <small id="comments-rules">Enter 10-1000 characters.</small>
      </form-group>

      <form-group>
        <input type="hidden" name="possible_bot" value="true" />
      </form-group>

      <form-group>
        <input type="hidden" name="form-errors" id="form-errors" />
      </form-group>

      <!-- Error message area -->
      <div id="error-area" role="status" aria-live="polite"></div>

      <!-- Information message area -->
      <div id="info-area" role="status" aria-live="polite"></div>

      <button type="submit">Submit</button>
    </form>

    <script src="form.js" defer></script>
  </body>
</html>
